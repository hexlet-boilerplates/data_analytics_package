name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Python, uv, ruff, ty и hk ставятся из mise.toml, версии зафиксированы в mise.lock
      - uses: jdx/mise-action@v5
      - name: Install dependencies
        run: make install
      - name: Run checks
        run: mise exec -- hk check --all
      - name: Run notebook
        run: make run
