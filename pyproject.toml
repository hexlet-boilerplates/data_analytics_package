[project]
name = "data-analytics-package"
version = "0.1.0"
description = "Data analytics example project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib",
    "pandas",
    "seaborn",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
]

[tool.deptry.per_rule_ignores]
# jupyter это метапакет: ноутбук запускает make run (jupyter execute), импорта в коде нет
DEP002 = ["jupyter"]
